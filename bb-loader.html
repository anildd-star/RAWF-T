<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAF — Otomatik BB Loader</title>
    <meta
      name="description"
      content="6mm airsoft BB şarjör hız yükleyici — hopper, krank/motor besleme, etkileşimli 3D model."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div class="vignette" aria-hidden="true"></div>
      <div id="canvas-wrap"></div>

      <div class="hud">
        <header class="brand-block">
          <p class="product-link">
            <a href="index.html">RAF Organizör</a>
            <span aria-hidden="true">·</span>
            <span>BB Loader</span>
          </p>
          <h1 class="brand">RAF<span>BB Loader</span></h1>
          <p class="tagline">
            Otomatik 6mm BB şarjör yükleyici. Hopper rezervuar, krank/dişli
            besleme ve hızlı adaptör nozulu.
          </p>
          <div class="cta-row">
            <button type="button" class="btn btn-primary" id="btn-load">
              Otomatik Yükle
            </button>
            <button type="button" class="btn btn-ghost" id="btn-spin">
              Otomatik Döndür
            </button>
            <button type="button" class="btn btn-ghost" id="btn-reset">
              Sıfırla
            </button>
          </div>
        </header>

        <p class="hint">Sürükle · Yakınlaştır · Parçalara tıkla</p>
      </div>

      <nav class="parts" aria-label="Parça odakları">
        <button type="button" class="part-chip" data-part="hopper">Hopper</button>
        <button type="button" class="part-chip" data-part="drive">Krank / dişli</button>
        <button type="button" class="part-chip" data-part="feed">Besleme nozulu</button>
        <button type="button" class="part-chip" data-part="magazine">Şarjör adaptörü</button>
        <button type="button" class="part-chip" data-part="battery">Pil bölmesi</button>
        <button type="button" class="part-chip" data-part="grip">Tutamak</button>
      </nav>
    </div>

    <script type="module" src="js/bb-loader.js"></script>
  </body>
</html>
