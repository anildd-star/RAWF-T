<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAF — Silah Organizörü</title>
    <meta
      name="description"
      content="Duvara monte ahşap-çelik silah organizörü — etkileşimli 3D model."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div class="vignette" aria-hidden="true"></div>
      <div id="canvas-wrap"></div>

      <div class="hud">
        <header class="brand-block">
          <h1 class="brand">RAF<span>Silah Organizörü</span></h1>
          <p class="tagline">
            Duvara monte meşe panel ve çelik ray sistemi. Dört uzun namlu yuvası,
            tabanca askıları, şarjör rafı. Centauri Carbon 2 baskı kiti hazır
            (<code>print/</code>).
          </p>
          <div class="cta-row">
            <button type="button" class="btn btn-primary" id="btn-spin">
              Otomatik Döndür
            </button>
            <button type="button" class="btn btn-ghost" id="btn-reset">
              Sıfırla
            </button>
            <a class="btn btn-ghost" href="print/PRINT_GUIDE.md">Baskı kılavuzu</a>
          </div>
        </header>

        <p class="hint">Sürükle · Yakınlaştır · Parçalara tıkla</p>
      </div>

      <nav class="parts" aria-label="Parça odakları">
        <button type="button" class="part-chip" data-part="cradles">Tüfek yuvaları</button>
        <button type="button" class="part-chip" data-part="pistols">Tabanca askıları</button>
        <button type="button" class="part-chip" data-part="magazines">Şarjör rafı</button>
        <button type="button" class="part-chip" data-part="shelf">Üst raf</button>
        <button type="button" class="part-chip" data-part="pegs">Askı şeridi</button>
      </nav>
    </div>

    <script type="module" src="js/organizer.js"></script>
  </body>
</html>
